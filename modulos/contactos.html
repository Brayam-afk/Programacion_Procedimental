<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="/CSS/contactos.css">
</head>
</head>

<body>
    <center>
        <h1>CONTACTOS</h1>
    </center>
    <div class="field.nombre">
        <label class="label">Correo</label>
        <div class="control has-icons-left has-icons-right">
            <input id="Correo" class="input is-success" type="text" placeholder="Text input" value="bulma">
            <span class="icon is-small is-left">
                <i class="fas fa-user"></i>
            </span>
            <span class="icon is-small is-right">
                <i class="fas fa-check"></i>
            </span>
        </div>
        <div class="field">
            <label class="label">Escribe aqui tu mensaje</label>
            <div class="control">
                <textarea id="mensaje" class="textarea" placeholder="Textarea"></textarea>
            </div>
        </div>

    </div>


    <div class="field is-grouped"></div>
    <div class="control">
        <button class="button is-link">Enviar</button>
    </div>
    <div class="control">
        <a class="button is-link is-light" type="button" href="/index.html">Volver al Inicio
        </a>
    </div>
    </div>

<script src="../JS/contacto.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
