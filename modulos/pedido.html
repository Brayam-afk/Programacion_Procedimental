<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="/CSS/pedido.css">
</head>
<body>
<!--
Producto
Dirección
Nombre del Usuario
Cantidad
Metodo de Pago
Telefono
-->
 <center><h1>PEDIDOS</h1></center>
<div class="field.nombre">
        <label class="label">Producto</label>
        <div class="control has-icons-left has-icons-right">
            <input id="producto" class="input is-success" type="text" placeholder="Text input" value="bulma">
            <span class="icon is-small is-left">
                <i class="fas fa-user"></i>
            </span>
            <span class="icon is-small is-right">
                <i class="fas fa-check"></i>
            </span>
        </div>

    </div>
<div class="field.nombre">
        <label class="label">Dirección</label>
        <div class="control has-icons-left has-icons-right">
            <input id="direccion" class="input is-success" type="text" placeholder="Text input" value="bulma">
            <span class="icon is-small is-left">
                <i class="fas fa-user"></i>
            </span>
            <span class="icon is-small is-right">
                <i class="fas fa-check"></i>
            </span>
        </div>

    </div>
<div class="field.nombre">
        <label class="label">Nombre del Usuario</label>
        <div class="control has-icons-left has-icons-right">
            <input id="nombre_usuario" class="input is-success" type="text" placeholder="Text input" value="bulma">
            <span class="icon is-small is-left">
                <i class="fas fa-user"></i>
            </span>
            <span class="icon is-small is-right">
                <i class="fas fa-check"></i>
            </span>
        </div>

    </div>
<div class="field.nombre">
        <label class="label">Cantidad</label>
        <div class="control has-icons-left has-icons-right">
            <input id="cantidad" class="input is-success" type="text" placeholder="Text input" value="bulma">
            <span class="icon is-small is-left">
                <i class="fas fa-user"></i>
            </span>
            <span class="icon is-small is-right">
                <i class="fas fa-check"></i>
            </span>
        </div>

    </div>
<div class="field.nombre">
        <label class="label">Metodo de Pago</label>
        <div class="control has-icons-left has-icons-right">
            <input id="metodo_pago" class="input is-success" type="text" placeholder="Text input" value="bulma">
            <span class="icon is-small is-left">
                <i class="fas fa-user"></i>
            </span>
            <span class="icon is-small is-right">
                <i class="fas fa-check"></i>
            </span>
        </div>

    </div>
    <div class="field.nombre">
        <label class="label">Telefono</label>
        <div class="control has-icons-left has-icons-right">
            <input id="telefono" class="input is-success" type="text" placeholder="Text input" value="bulma">
            <span class="icon is-small is-left">
                <i class="fas fa-user"></i>
            </span>
            <span class="icon is-small is-right">
                <i class="fas fa-check"></i>
            </span>
        </div>

    </div>

  <div class="field is-grouped"></div>
        <div class="control">
            <button class="button is-link" id="btnenviar">Enviar</button>
        </div>
        <div class="control">
            <a class="button is-link is-light" type="button" href="/index.html">Volver al Inicio
            </a>
        </div>
    </div>

<script src="../JS/pedido.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
