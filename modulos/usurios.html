<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="../CSS/usurios.css">

</head>

<body>
 <center><h1>USUARIOS</h1></center>

    <div class="field.nombre">
        <label class="label">Nombre Completo</label>
        <div class="control has-icons-left has-icons-right">
            <input id="nombre" class="input is-success" type="text" placeholder="Text input" value="bulma">
            <span class="icon is-small is-left">
                <i class="fas fa-user"></i>
            </span>
            <span class="icon is-small is-right">
                <i class="fas fa-check"></i>
            </span>
        </div>

    </div>
    <div class="field.direc">
        <label class="label">Direccion</label>
        <div id="direccion" class="control has-icons-left has-icons-right">
            <input class="input is-success" type="text" placeholder="Text input" value="bulma">
            <span class="icon is-small is-left">
                <i class="fas fa-user"></i>
            </span>
            <span class="icon is-small is-right">
                <i class="fas fa-check"></i>
            </span>
        </div>
    </div>
    <div class="field.correo">
        <label class="label">Correo</label>
        <div class="control has-icons-left has-icons-right">
            <input id="correo" class="input is-danger" type="email" placeholder="Email input" value="hello@">
            <span class="icon is-small is-left">
                <i class="fas fa-envelope"></i>
            </span>
            <span class="icon is-small is-right">
                <i class="fas fa-exclamation-triangle"></i>
            </span>
        </div>
        <p class="help is-danger">Correo Invalido</p>
    </div>
    <div class="field.contraseña">
        <label class="label">Contraseña</label>
        <div class="control has-icons-left has-icons-right">
            <input id="contraseña" class="input is-danger" type="email" placeholder="Email input" value="hello@">
            <span class="icon is-small is-left">
                <i class="fas fa-envelope"></i>
            </span>
            <span class="icon is-small is-right">
                <i class="fas fa-exclamation-triangle"></i>
            </span>
        </div>
        <p class="help is-danger">Contaseña Incorrecta</p>
    </div>
    <div class="field.nacimiento">
         <label class="label">Año de Nacimniento</label>
        <form>
           <label for="birthday">Año de Nacimiento</label>
           <input type="date" id="birthday" name="birthday" required>

            <input type="submit" value="Submit">
        </form>
    </div>

    <div class="field.documento">
        <label class="label">Documento</label>
        <div class="control has-icons-left has-icons-right">
            <input id="documento" class="input is-success" type="text" placeholder="Text input" value="bulma">
            <span class="icon is-small is-left">
                <i class="fas fa-user"></i>
            </span>
            <span class="icon is-small is-right">
                <i class="fas fa-check"></i>
            </span>
        </div>

    </div>
    <div class="field.estado">
        <div class="field-label">
            <label class="label">Estado Civil?</label>
        </div>
        <div class="field-body">
            <div class="field is-narrow">
                <div class="control">
                    <label class="radio">
                        <input type="radio" name="member">
                        Casado
                    </label>
                    <label class="radio">
                        <input type="radio" name="member">
                        Soltero
                    </label>
                </div>
            </div>
        </div>
    </div>
    <div class="field.rol">
        <div class="field-label">
            <label class="label">Rol</label>
        </div>
        <div class="field-body">
            <div class="field is-narrow">
                <div class="control">
                    <label class="radio">
                        <input type="radio" name="member">
                        Empleado
                    </label>
                    <label class="radio">
                        <input type="radio" name="member">
                        Administrador
                    </label>
                    <label class="radio">
                        <input type="radio" name="member">
                        Usuario
                    </label>
                </div>
            </div>
        </div>

    </div>
    <div class="field.genero">
        <div class="field-label">
            <label class="label">Genero</label>
        </div>
        <div class="field-body">
            <div class="field is-narrow">
                <div class="control">
                    <label class="radio">
                        <input type="radio" name="member">
                        Masculino
                    </label>
                    <label class="radio">
                        <input type="radio" name="member">
                        Femenino
                    </label>
                </div>
            </div>
        </div>
    </div>
    <div class="field.profesion">
        <label class="label">Profesión</label>
        <div class="control has-icons-left has-icons-right">
            <input id="profesion" class="input is-success" type="text" placeholder="Text input" value="bulma">
            <span class="icon is-small is-left">
                <i class="fas fa-user"></i>
            </span>
            <span class="icon is-small is-right">
                <i class="fas fa-check"></i>
            </span>
        </div>

    </div>
    <div class="field is-grouped"></div>
        <div class="control">
            <button class="button is-link" id="btnenviar">Enviar</button>
        </div>
        <div class="control">
            <a class="button is-link is-light" type="button" href="/index.html" >Volver al Inicio
            </a>
        </div>
    </div>



<script src="../JS/usuarios.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
