<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">

</head>
<body>
    <!--Ventas
    Fecha

 <center><h1>CONTABILIDAD</h1></center>
    <div class="field.nombre">
        <label class="label">Ventas</label>
        <div class="control has-icons-left has-icons-right">
            <input class="input is-success" type="text" placeholder="Text input" value="bulma">
            <span class="icon is-small is-left">
                <i class="fas fa-user"></i>
            </span>
            <span class="icon is-small is-right">
                <i class="fas fa-check"></i>
            </span>
        </div>

    </div>
  <div class="field.Fecha">
         <label class="label">Fecha</label>
        <form>
           <label for="birthday">Fecha</label>
           <input type="date" id="birthday" name="birthday" required>

            <input type="submit" value="Submit">
        </form>
    </div>
    <div class="field.nombre">
        <label class="label">Ingresos</label>
        <div class="control has-icons-left has-icons-right">
            <input class="input is-success" type="text" placeholder="Text input" value="bulma">

                <i class="fas fa-user"></i>
            </span>
            <span class="icon is-small is-right">
                <i class="fas fa-check"></i>
            </span>
        </div>

    </div>
    <div class="field.nombre">
        <label class="label">Engresos</label>
        <div class="control has-icons-left has-icons-right">
            <input class="input is-success" type="text" placeholder="Text input" value="bulma">
            <span class="icon is-small is-left">
                <i class="fas fa-user"></i>
            </span>
            <span class="icon is-small is-right">
                <i class="fas fa-check"></i>
            </span>
        </div>

    </div>
    <div class="field.nombre">
        <label class="label">Concepto</label>
        <div class="control has-icons-left has-icons-right">
            <input class="input is-success" type="text" placeholder="Text input" value="bulma">
            <span class="icon is-small is-left">
                <i class="fas fa-user"></i>
            </span>
            <span class="icon is-small is-right">
                <i class="fas fa-check"></i>
            </span>
        </div>

    </div>
    <div class="field.nombre">
        <label class="label">Valor</label>
        <div class="control has-icons-left has-icons-right">
            <input class="input is-success" type="text" placeholder="Text input" value="bulma">
            <span class="icon is-small is-left">
                <i class="fas fa-user"></i>
            </span>
            <span class="icon is-small is-right">
                <i class="fas fa-check"></i>
            </span>
        </div>

    </div>


    <div class="field is-grouped"></div>
        <div class="control">
            <button class="button is-link">Enviar</button>
        </div>
        <div class="control">
            <a class="button is-link is-light" type="button" href="/index.html">Volver al Inicio
            </a>
        </div>
    </div>
</body>
